<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1 id="h3">sammad and hasam ki jori dadam da dadam di da jori aee hasam aur sammad ki jori </h1>
    <button id="yellow">sammad</button>

    <script src="jquery-4.0.0.min.js"></script>
    <script>

        // })   
        // $('h1').css("background-color","blue") 
        // $('h1').text("sammad")          
          $('#yellow').click(function(){

        $('#off').click(function(){

        // fade work start from here 
       $('#fade').click(function(){

       })
